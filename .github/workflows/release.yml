name: Release CLI

# Tag-triggered publish of the ONLY published artifact (packages/cli → `zframes`
# on npm). Push a tag `vX.Y.Z` that matches packages/cli/package.json and this
# verifies, builds, packs (pnpm pack rewrites workspace:* deps, matching the
# manual publishes), then publishes with npm TRUSTED PUBLISHING (OIDC): no npm
# token stored anywhere, and a provenance attestation is generated automatically.
#
# One-time setup on npmjs.com (or the publish step fails auth):
#   zframes package → Settings → Trusted Publisher → GitHub Actions
#   org: zentryHQ · repo: zframes · workflow: release.yml
#
# Release = bump packages/cli/package.json version, commit, then:
#   git tag v<version> && git push origin v<version>
#
# The release commit's subject becomes the Release title and its body the
# Release notes, so a release is written once, in the commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release for the tag
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; upgrade whatever Node bundled.
      - run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Tag must match packages/cli version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != packages/cli version $PKG — bump the version or retag"
            exit 1
          fi

      - run: pnpm typecheck
      # Same formatting gate as CI: without it a release can ship from a commit
      # whose CI is red (0.14.0 did exactly that), leaving a failing badge on
      # the repo while npm looks healthy.
      - run: pnpm format:check
      - run: pnpm test

      # prepack (runtime build → tsup → assert-artifacts) runs inside pack, so
      # the published tarball always carries a freshly-built runtime bundle.
      - name: Pack
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish (OIDC, provenance)
        run: npm publish "$RUNNER_TEMP"/zframes-*.tgz

      # After the publish, so a failed publish never leaves a release page
      # pointing at a version that is not on npm. The release commit already
      # describes the release, so its subject is the title and its body the
      # notes; a bodyless commit falls back to the generated commit list.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — nothing to do"
            exit 0
          fi
          TITLE="$(git log -1 --pretty=%s HEAD)"
          TITLE="${TITLE#:*: }"
          case "$TITLE" in [!A-Za-z0-9]*' '*) TITLE="${TITLE#* }" ;; esac
          TITLE="${TITLE#release }"
          TITLE="${TITLE#zframes cli }"
          BODY="$(git log -1 --pretty=%b HEAD)"
          if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --generate-notes
          fi
